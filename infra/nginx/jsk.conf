# ============================================================================
# JSK HRM & PM — nginx reverse proxy (same-origin deployment)
#
# Web:  static files from apps/web/dist
# API:  proxied to the NestJS server on 127.0.0.1:3000
#
# The app uses cookie auth + CSRF and two SSE streams
# (/api/messages/stream, /api/notifications/stream) → proxy_buffering must be
# OFF for /api/.
# ============================================================================

server {
    listen 80;
    server_name hrm.example.com;
    # ACME challenge for certbot if used
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name hrm.example.com;

    ssl_certificate     /etc/letsencrypt/live/hrm.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hrm.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50m;   # file uploads (25 MB message cap + headroom)

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ---- API + SSE ----------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Required for Server-Sent Events (messages + notifications streams)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Connection '';
    }

    # ---- Web static build ----------------------------------------------------
    root /opt/jsk/apps/web/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;   # SPA fallback
    }

    # Long-cache hashed assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
